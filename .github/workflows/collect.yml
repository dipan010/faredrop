# The daily collector, on GitHub's machines instead of a laptop that sleeps.
#
# Each run restores the history from encrypted snapshots on the `data`
# release (dbstore.py), runs the pipeline, and stores a new snapshot. Four
# slots a day: collect.py fetches only what today is still missing, so after
# a complete run the later slots cost no API calls, and a slot GitHub runs
# late or skips is covered by the next one.
name: collect

on:
  schedule:
    # UTC. :47 rather than :00/:15, which are GitHub's busiest minutes and the
    # likeliest to be delayed or dropped. All four fall inside one UTC day,
    # the day the collector counts in. In IST: 07:17, 13:17, 19:17, 23:17.
    - cron: "47 1 * * *"
    - cron: "47 7 * * *"
    - cron: "47 13 * * *"
    - cron: "47 17 * * *"
  workflow_dispatch:

permissions:
  contents: write          # upload and prune snapshots on the data release

# One run at a time, and never cancelled: two overlapping runs would both
# start from the same snapshot, and the second upload would drop the first
# run's fares.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      FAREDROP_DB_KEY: ${{ secrets.FAREDROP_DB_KEY }}
      TRAVEL_PAYOUTS_API_KEY: ${{ secrets.TRAVEL_PAYOUTS_API_KEY }}
      # Secrets, not plain values, so addresses are masked in public logs.
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_TO: ${{ secrets.ALERT_TO }}
    steps:
      # Until FAREDROP_DB_KEY is set, the collector isn't set up: skip quietly
      # rather than fail four times a day. The key is set last, after the
      # first snapshot is uploaded, so from then on a missing or unreadable
      # history fails the job loudly instead.
      - name: Check it is set up
        id: ready
        run: |
          if [ -z "$FAREDROP_DB_KEY" ]; then
            echo "::notice::FAREDROP_DB_KEY secret not set -- collector not set up yet, skipping"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == 'true'

      - uses: actions/setup-python@v5
        if: steps.ready.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-verify.txt

      - name: Install the re-check's scraper
        if: steps.ready.outputs.ok == 'true'
        run: pip install -r requirements-verify.txt

      # Fails the job -- before anything can run on an empty database -- if
      # no recent snapshot decrypts and passes an integrity check.
      - name: Restore the history
        id: pull
        if: steps.ready.outputs.ok == 'true'
        run: python3 dbstore.py pull

      # Same order and the same "a failing step never stops the next" rule as
      # daily.sh. Collection first: it is the only step that can't be redone.
      - name: Collect, model, detect, alert
        if: steps.ready.outputs.ok == 'true'
        run: |
          python3 collect.py || echo "::warning::collect failed (rc=$?) -- history may have a gap"
          python3 baseline.py || echo "::warning::baseline failed"
          python3 detect.py || echo "::warning::detect failed"
          python3 verify.py || echo "::warning::verify failed -- alerts go out unchecked"
          python3 digest.py || true
          python3 notify.py || echo "::warning::notify failed"
          python3 health.py || echo "::warning::health failed"

      # Runs even if the pipeline failed, so a partial day's fares are kept --
      # but only when the restore worked, so an empty database is never stored.
      - name: Store the history
        if: always() && steps.pull.outcome == 'success'
        run: python3 dbstore.py push
